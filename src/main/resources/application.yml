spring:
  application:
    name: expense-splitter

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_splitter}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema; Hibernate must never create/alter tables itself.
    # "validate" checks entity mappings against the real schema at startup and
    # fails fast on mismatch, without touching DDL.
    hibernate:
      ddl-auto: validate
    # Disables Open-Session-In-View: DB sessions close when the service layer
    # returns, instead of staying open through the controller/view rendering.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}